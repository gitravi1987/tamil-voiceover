<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tamil Voiceover</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; font-size: 14px; }
      h3 { margin: 0 0 8px; }
      label { display: block; margin: 10px 0 2px; font-weight: 600; }
      select, input[type="range"] { width: 100%; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .hint { color: #555; font-size: 12px; margin-top: 2px; }
      #status { margin-top: 14px; padding: 8px; background: #f2f2f2; border-radius: 6px; font-size: 12px; word-break: break-word; }
    </style>
  </head>
  <body>
    <h3>Tamil Voiceover</h3>

    <div class="row"><input type="checkbox" id="enabled" /><label for="enabled" style="margin:0">Voiceover on</label></div>

    <label for="mode">Mode</label>
    <select id="mode">
      <option value="tamil">Tamil lines only (use Tamil subtitles)</option>
      <option value="timing">Timing test (speaks any line)</option>
    </select>
    <div class="hint">Timing test uses an English voice for English lines, to check timing and volume dip. Translation comes in Phase 2.</div>

    <label for="dip">Movie volume while voice speaks: <span id="dipVal"></span></label>
    <input type="range" id="dip" min="0" max="100" step="5" />

    <label for="rate">Voice speed: <span id="rateVal"></span></label>
    <input type="range" id="rate" min="0.7" max="1.5" step="0.05" />

    <div class="row"><input type="checkbox" id="hideSubtitles" /><label for="hideSubtitles" style="margin:0">Hide on-screen subtitles</label></div>

    <div id="status">Open a Netflix movie to see status.</div>
    <script src="popup.js"></script>
  </body>
</html>
